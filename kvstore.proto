syntax = "proto3";

package kvstore;


enum ReadConsistency {
  LINEARIZABLE = 0;    // Must hit Leaseholder / Quorum
  FOLLOWER_STALE = 1;  // Served by local replica; bounded staleness
}

enum WriteStrategy {
  QUORUM_CP = 0;  // Requires majority (N/2 + 1) ACKs; fails if quorum lost
  ALWAYS_AP = 1;  // Accepts write on any available node; logs timestamp (LWW)
}

message GetRequest {
  string key = 1;
  ReadConsistency consistency = 2;
  uint32 max_staleness_ms = 3;  // Used when consistency == FOLLOWER_STALE (0 = unbounded)
}

message GetReply {
  string value = 1;
  bool found = 2;
  uint64 read_timestamp = 3;  // version (microsecond timestamp) of the returned value
  bool is_stale = 4;          // true if the serving follower cannot vouch for freshness
}

message PutRequest {
  string key = 1;
  string value = 2;
  string idempotency_key = 3;
  WriteStrategy strategy = 4;
  uint64 timestamp = 5;       // 0 = let the coordinator assign one (microseconds)
  uint32 write_quorum = 6;    // W for QUORUM_CP; 0 = majority (N/2 + 1)
}

message PutReply {
  bool success = 1;
  uint32 acks_received = 2;
  string error_message = 3;
}


enum ReplicatePhase {
  PHASE_PREPARE = 0;    // CP: "can you accept this write?" (promise, not visible yet)
  PHASE_COMMIT = 1;     // CP: apply the prepared write
  PHASE_ABORT = 2;      // CP: drop the promise (quorum was not reached)
  PHASE_APPLY = 3;      // AP: best-effort replication of a locally accepted write
  PHASE_HEARTBEAT = 4;  // leaseholder -> followers liveness (drives staleness bound)
}

message ReplicateRequest {
  ReplicatePhase phase = 1;
  string key = 2;
  string value = 3;
  uint64 timestamp = 4;
  string origin = 5;           // node that accepted the write (LWW tie-breaker)
  string idempotency_key = 6;
  string sender = 7;
}

message ReplicateReply {
  bool ok = 1;
}

message Entry {
  string key = 1;
  string value = 2;
  uint64 timestamp = 3;
  string origin = 4;
}

message DumpRequest {}
message DumpReply {
  repeated Entry entries = 1;
}

// Anti-entropy: "pull the state of all reachable peers now and merge (LWW)".
message SyncRequest {}
message SyncReply {
  uint32 entries_merged = 1;
  uint32 peers_reached = 2;
}

service KeyValueStore {
  rpc Get (GetRequest) returns (GetReply);
  rpc Put (PutRequest) returns (PutReply);
  // internal
  rpc Replicate (ReplicateRequest) returns (ReplicateReply);
  rpc Dump (DumpRequest) returns (DumpReply);
  rpc Sync (SyncRequest) returns (SyncReply);
}
